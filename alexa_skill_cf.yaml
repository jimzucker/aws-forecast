AWSTemplateFormatVersion: '2010-09-09'
Description: AWS Cost Summary Alexa skill Lambda. Triggered by Alexa Skills Kit principal, no per-user credentials.

Parameters:
  AlexaSkillId:
    Type: String
    Description: Your Alexa skill ID from the Alexa developer console (amzn1.ask.skill.<uuid>).
    AllowedPattern: "^amzn1\\.ask\\.skill\\..+$"

  CodeS3Bucket:
    Type: String
    Description: S3 bucket containing the deployment zip.

  CodeS3Key:
    Type: String
    Default: alexa_handler.zip
    Description: S3 key of the deployment zip.

Resources:

  alexaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Path: "/"
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: cost-readonly
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ce:GetCostAndUsage
                  - ce:GetCostForecast
                Resource: "*"
              - Effect: Allow
                Action:
                  - organizations:DescribeAccount
                Resource: "*"
              - Effect: Allow
                Action:
                  - sts:GetCallerIdentity
                Resource: "*"

  alexaLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: aws-cost-alexa-handler
      Role: !GetAtt alexaRole.Arn
      Timeout: 15
      MemorySize: 256
      Handler: alexa_handler.lambda_handler
      Runtime: python3.12
      Code:
        S3Bucket: !Ref CodeS3Bucket
        S3Key: !Ref CodeS3Key

  alexaLogGroup:
    Type: AWS::Logs::LogGroup
    DependsOn: alexaLambda
    Properties:
      LogGroupName: !Sub "/aws/lambda/${alexaLambda}"
      RetentionInDays: 7

  alexaSkillsKitInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref alexaLambda
      Action: lambda:InvokeFunction
      Principal: alexa-appkit.amazon.com
      EventSourceToken: !Ref AlexaSkillId

Outputs:
  LambdaArn:
    Description: Paste this ARN into the Endpoint field of your Alexa skill in the Alexa developer console.
    Value: !GetAtt alexaLambda.Arn

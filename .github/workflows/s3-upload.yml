name: Upload to S3

on:
  push:
    branches:
      - main

# OIDC federation: the job requests a short-lived token from GitHub and
# exchanges it for AWS credentials by assuming a role — no long-lived
# access keys stored in repo secrets. Role setup: see IAM_Configuration.md.
permissions:
  id-token: write
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
      - name: Zip get_forecast.py file
        run: zip get_forecast.zip get_forecast.py
      - name: Upload file to S3
        run: aws s3 cp get_forecast.zip s3://jimzucker-github-getforecast
